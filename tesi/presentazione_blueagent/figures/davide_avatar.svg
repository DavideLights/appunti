<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae2d3" />
      <stop offset="60%" stop-color="#f3cdb5" />
      <stop offset="100%" stop-color="#e8bfa6" />
    </linearGradient>
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543e2e" />
      <stop offset="100%" stop-color="#3d2a1d" />
    </linearGradient>
    <linearGradient id="stubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6b8a2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c49e85" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="lensSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.08" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="114" />
    </clipPath>
  </defs>

  <!-- Outer Ring with Subtle Tech Blue Style -->
  <circle cx="120" cy="120" r="117" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="120" cy="120" r="113" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 4" opacity="0.8" />
  
  <g clip-path="url(#circleClip)">
    <!-- Background Circle -->
    <rect width="240" height="240" fill="url(#bgGrad)" />
    
    <!-- Subtle circular grid line -->
    <circle cx="120" cy="120" r="88" fill="none" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.6" />
    
    <!-- Shoulders & Dark T-Shirt -->
    <path d="M 35 240 C 35 198, 68 188, 92 186 L 148 186 C 172 188, 205 198, 205 240 Z" fill="#18181b" />
    <!-- T-Shirt Collar Rim -->
    <path d="M 94 186 C 105 197, 135 197, 146 186 C 138 200, 102 200, 94 186 Z" fill="#27272a" />

    <!-- Neck -->
    <path d="M 98 148 L 98 188 C 108 193, 132 193, 142 188 L 142 148 Z" fill="#e5b898" />
    <!-- Neck shadow under beard -->
    <path d="M 98 150 C 110 165, 130 165, 142 150 L 142 163 C 130 176, 110 176, 98 163 Z" fill="#cf9d7c" opacity="0.55" />

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 58 116 C 52 116, 48 123, 48 133 C 48 143, 53 149, 61 149 L 64 141 Z" fill="#f0c6ad" stroke="#d49f7e" stroke-width="1.2" />
    <path d="M 54 126 C 52 128, 52 135, 55 140" fill="none" stroke="#c08a67" stroke-width="1.4" stroke-linecap="round" />
    <!-- Right Ear -->
    <path d="M 182 116 C 188 116, 192 123, 192 133 C 192 143, 187 149, 179 149 L 176 141 Z" fill="#f0c6ad" stroke="#d49f7e" stroke-width="1.2" />
    <path d="M 186 126 C 188 128, 188 135, 185 140" fill="none" stroke="#c08a67" stroke-width="1.4" stroke-linecap="round" />

    <!-- Head / Cranium (Well-proportioned bald/shaved head with gentle dome) -->
    <path d="M 60 120 
             C 60 66, 78 50, 120 50 
             C 162 50, 180 66, 180 120 
             C 180 156, 170 184, 120 184 
             C 70 184, 60 156, 60 120 Z" 
          fill="url(#skinGrad)" filter="url(#softShadow)" />

    <!-- Shaved Head Stubble Shadow (gentle buzz-cut hint on top/sides) -->
    <path d="M 61 114 C 62 68, 80 51, 120 51 C 160 51, 178 68, 179 114 C 172 74, 154 58, 120 58 C 86 58, 68 74, 61 114 Z" fill="url(#stubbleGrad)" />

    <!-- Soft Cheek Tone / Warmth -->
    <ellipse cx="80" cy="136" rx="9" ry="5" fill="#f43f5e" opacity="0.08" />
    <ellipse cx="160" cy="136" rx="9" ry="5" fill="#f43f5e" opacity="0.08" />

    <!-- Eyebrows (neat, slightly arched, dark brown) -->
    <path d="M 74 109 C 83 105, 96 106, 105 110" fill="none" stroke="#3d2a1d" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 135 110 C 144 106, 157 105, 166 109" fill="none" stroke="#3d2a1d" stroke-width="2.8" stroke-linecap="round" />

    <!-- Eyes Behind Glasses -->
    <g>
      <!-- Left Eye -->
      <ellipse cx="90" cy="122" rx="9.5" ry="5.8" fill="#ffffff" />
      <ellipse cx="90.5" cy="122" rx="4.8" ry="4.8" fill="#291a10" />
      <circle cx="92.5" cy="120" r="1.4" fill="#ffffff" />
      <path d="M 80 121 C 84 117.5, 96 117.5, 100 121" fill="none" stroke="#3d2a1d" stroke-width="1.3" stroke-linecap="round" />

      <!-- Right Eye -->
      <ellipse cx="150" cy="122" rx="9.5" ry="5.8" fill="#ffffff" />
      <ellipse cx="149.5" cy="122" rx="4.8" ry="4.8" fill="#291a10" />
      <circle cx="151.5" cy="120" r="1.4" fill="#ffffff" />
      <path d="M 140 121 C 144 117.5, 156 117.5, 160 121" fill="none" stroke="#3d2a1d" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- Nose -->
    <path d="M 117 116 L 115 136 C 112 142, 118 146, 120 146 C 122 146, 128 142, 125 136 L 123 116" 
          fill="#f3cdb5" />
    <path d="M 114 143 C 117 146.5, 123 146.5, 126 143" fill="none" stroke="#c08a67" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="112" cy="142.5" r="1.2" fill="#c08a67" opacity="0.6" />
    <circle cx="128" cy="142.5" r="1.2" fill="#c08a67" opacity="0.6" />

    <!-- FULL BEARD & MUSTACHE (Continuous, natural shape matching photo) -->
    <path d="M 61 123 
             C 61 146, 66 176, 98 184
             C 112 187, 128 187, 142 184
             C 174 176, 179 146, 179 123
             C 176 132, 172 144, 162 148
             C 152 153, 142 152, 137 148
             C 133 145, 128 147, 120 148
             C 112 147, 107 145, 103 148
             C 98 152, 88 153, 78 148
             C 68 144, 64 132, 61 123 Z" 
          fill="url(#beardGrad)" />

    <!-- Mouth & Smile (Under mustache) -->
    <path d="M 110 160 C 115 164, 125 164, 130 160" fill="none" stroke="#881337" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Mustache connecting naturally into beard sides -->
    <path d="M 100 152 
             C 107 145, 114 145, 120 148 
             C 126 145, 133 145, 140 152 
             C 134 158, 127 156, 120 155 
             C 113 156, 106 158, 100 152 Z" 
          fill="#473224" />

    <!-- Subtle Beard Detail Under Lip -->
    <path d="M 116 164 C 118 162, 122 162, 124 164 C 122 169, 118 169, 116 164 Z" fill="#352317" />

    <!-- GLASSES (Black rectangular with rounded corners, matching photo) -->
    <!-- Temples -->
    <path d="M 52 125 L 67 122" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <path d="M 188 125 L 173 122" stroke="#111827" stroke-width="3" stroke-linecap="round" />

    <!-- Left Frame -->
    <rect x="67" y="108" width="46" height="31" rx="6.5" ry="6.5" fill="url(#lensSheen)" stroke="#111827" stroke-width="3.8" />
    <!-- Right Frame -->
    <rect x="127" y="108" width="46" height="31" rx="6.5" ry="6.5" fill="url(#lensSheen)" stroke="#111827" stroke-width="3.8" />
    
    <!-- Central Bridge -->
    <path d="M 113 115 C 117 113.5, 123 113.5, 127 115" fill="none" stroke="#111827" stroke-width="4.2" stroke-linecap="round" />

    <!-- Anti-reflection glass gleams -->
    <path d="M 72 113 L 81 113 L 74 133 L 71 133 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 132 113 L 141 113 L 134 133 L 131 133 Z" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
